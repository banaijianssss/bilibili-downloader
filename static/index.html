<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bilibili下载器</title>
  <link rel="stylesheet" href="/static/app.css?v=6" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="mark" aria-hidden="true">B</div>
        <div>
          <h1>bilibili下载器</h1>
          <p class="tagline">本地检索 · 播放 · 存档</p>
        </div>
      </div>
      <nav class="nav">
        <button class="active" data-view="home">发现</button>
        <button data-view="search">搜索</button>
        <button data-view="tasks">下载任务</button>
        <button id="open-settings">账号与画质</button>
      </nav>
      <div class="side-foot">
        <div class="account-row">
          <span class="status-dot" id="cookie-dot"></span>
          <strong id="cookie-label">未登录</strong>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="top">
        <form class="search" id="search-form">
          <input id="q" placeholder="搜索视频、UP 主，或粘贴 BV / AV / 链接" autocomplete="off" />
          <button class="primary" type="submit">搜索</button>
        </form>
        <button class="icon-btn" id="open-tasks" title="下载任务" type="button">↓</button>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="drawer-back" id="drawer-back"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h3>下载队列</h3>
      <button class="ghost" id="close-drawer" type="button">关闭</button>
    </div>
    <div id="jobs"></div>
  </aside>

  <div class="modal-back" id="settings-back">
    <div class="modal">
      <h3>账号与画质</h3>
      <p>未登录通常只能稳定拿到 480P/720P。用哔哩哔哩手机 App 扫码登录后，yt-dlp 会按账号权益请求 1080P、1080P+、4K、HDR。登录信息只保存在本机 data/settings.json。</p>
      <div class="login-box" id="login-box">
        <div class="login-account" id="login-account"></div>
        <div class="qr-wrap" id="qr-wrap" hidden>
          <div class="qr" id="qr"></div>
          <div class="qr-tip" id="qr-tip">正在获取二维码…</div>
        </div>
        <div class="actions">
          <button class="primary" id="qr-login" type="button">扫码登录</button>
          <button class="ghost" id="logout" type="button" hidden>退出登录</button>
        </div>
      </div>
      <details class="manual">
        <summary>手动填写 Cookie（备用）</summary>
        <label for="sessdata">SESSDATA</label>
        <input id="sessdata" placeholder="可只贴 SESSDATA 的值" />
        <label for="cookie">完整 Cookie（可选，优先于 SESSDATA）</label>
        <textarea id="cookie" placeholder="SESSDATA=...; bili_jct=...; DedeUserID=..."></textarea>
        <div class="actions">
          <button class="ghost" id="save-settings" type="button">保存手动 Cookie</button>
        </div>
      </details>
      <div class="actions">
        <button class="ghost" id="close-settings" type="button">关闭</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/app.js?v=6"></script>
</body>
</html>
